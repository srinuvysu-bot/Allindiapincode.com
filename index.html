<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b67">
<title>India PIN Code Finder</title>
<style>
:root{--navy:#123b67;--blue:#1769aa;--ink:#172b4d;--muted:#63748b;--bg:#f3f7fb;--line:#dce6f0}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#102f52,#1769aa);color:white;padding:24px 18px 64px}
.top{max-width:980px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:20px;letter-spacing:.2px}.lang{border:1px solid #ffffff70;background:#ffffff18;color:white;border-radius:999px;padding:9px 14px;font-weight:700}
.hero{max-width:780px;margin:42px auto 0;text-align:center}.hero h1{font-size:clamp(28px,5vw,44px);margin:0 0 10px}.hero p{margin:0;color:#dbeafe}
main{max-width:900px;margin:-38px auto 40px;padding:0 16px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 35px #183b6014}
.tabs{display:flex;gap:8px;margin-bottom:16px}.tab{border:1px solid var(--line);background:#f7faff;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:700}.tab.active{background:#e8f2fc;border-color:#9fc6e8;color:var(--blue)}
.searchrow{display:flex;gap:10px}.searchrow input{flex:1;min-width:0;padding:15px;border:1px solid #cbd8e6;border-radius:11px;font:inherit;font-size:16px;outline:none}.searchrow input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}
button{cursor:pointer}.go{background:var(--blue);color:white;border:0;border-radius:11px;padding:0 22px;font:700 16px system-ui}.hint{font-size:13px;color:var(--muted);margin:10px 2px 0}
.status{margin-top:18px;color:var(--muted);text-align:center}.results{margin-top:20px}.summary{background:#eef6fd;border-radius:12px;padding:14px 16px;margin-bottom:14px}.summary strong{color:#124f83}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:13px;padding:15px;background:#fff}.card h3{margin:0 0 9px;font-size:17px;color:#124f83}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta div{font-size:13px;color:var(--muted)}.meta b{display:block;color:var(--ink);font-size:14px;margin-top:2px;overflow-wrap:anywhere}.pin{font-size:22px;font-weight:800;color:var(--blue);letter-spacing:1px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:10px 18px 28px}
@media(max-width:520px){.searchrow{flex-direction:column}.go{padding:14px}.hero{margin-top:32px}.panel{padding:16px}}
</style>
</head>
<body>
<header><div class="top"><div class="brand">🇮🇳 India PIN Finder</div><button class="lang" id="langBtn">తెలుగు</button></div>
<div class="hero"><h1 id="heading">Find Any India PIN Code</h1><p id="subheading">Search by 6-digit PIN code or post office name</p></div></header>
<main><section class="panel">
<div class="tabs"><button class="tab active" id="pinTab">PIN Code</button><button class="tab" id="officeTab">Post Office</button></div>
<form id="searchForm"><div class="searchrow"><input id="query" autocomplete="off" placeholder="Enter 6-digit PIN code" aria-label="Search PIN code"><button class="go" id="searchBtn" type="submit">Search</button></div></form>
<div class="hint" id="hint">Example: 500001 or Hyderabad</div>
<div class="status" id="status" aria-live="polite"></div><div class="results" id="results"></div>
</section></main>
<footer id="footer">Postal information is provided by a public third-party API. Verify important address details with India Post.</footer>
<script>
const $=id=>document.getElementById(id);let mode='pin',telugu=false;
const copy={
en:{title:'Find Any India PIN Code',sub:'Search by 6-digit PIN code or post office name',pin:'PIN Code',office:'Post Office',placeholder:'Enter 6-digit PIN code',search:'Search',hint:'Example: 500001 or Hyderabad',empty:'Please enter a PIN code or post office name.',loading:'Searching postal records…',none:'No matching post office found. Check your search and try again.',error:'Could not load results. Please try again in a moment.',bad:'Enter a valid 6-digit PIN code.',count:'post office record(s) found',district:'District',state:'State',type:'Office type',delivery:'Delivery status',division:'Division',region:'Region',circle:'Circle',footer:'Postal information is provided by a public third-party API. Verify important address details with India Post.'},
te:{title:'భారతదేశ PIN కోడ్ తెలుసుకోండి',sub:'6 అంకెల PIN కోడ్ లేదా పోస్టాఫీస్ పేరుతో వెతకండి',pin:'PIN కోడ్',office:'పోస్టాఫీస్',placeholder:'6 అంకెల PIN కోడ్ నమోదు చేయండి',search:'వెతకండి',hint:'ఉదాహరణ: 500001 లేదా Hyderabad',empty:'దయచేసి PIN కోడ్ లేదా పోస్టాఫీస్ పేరు నమోదు చేయండి.',loading:'పోస్టల్ వివరాలు వెతుకుతున్నాం…',none:'సంబంధిత పోస్టాఫీస్ దొరకలేదు. మళ్లీ ప్రయత్నించండి.',error:'వివరాలు పొందలేకపోయాం. కొద్దిసేపటి తర్వాత మళ్లీ ప్రయత్నించండి.',bad:'సరైన 6 అంకెల PIN కోడ్ నమోదు చేయండి.',count:'పోస్టాఫీస్ వివరాలు లభించాయి',district:'జిల్లా',state:'రాష్ట్రం',type:'ఆఫీస్ రకం',delivery:'డెలివరీ స్థితి',division:'డివిజన్',region:'రీజియన్',circle:'సర్కిల్',footer:'ఈ సమాచారం పబ్లిక్ థర్డ్-పార్టీ API ద్వారా వస్తుంది. ముఖ్యమైన చిరునామా వివరాలను India Post వద్ద నిర్ధారించుకోండి.'}
};
function t(k){return copy[telugu?'te':'en'][k]}
function renderLang(){
$('heading').textContent=t('title');$('subheading').textContent=t('sub');$('pinTab').textContent=t('pin');$('officeTab').textContent=t('office');$('searchBtn').textContent=t('search');$('query').placeholder=mode==='pin'?t('placeholder'):(telugu?'పోస్టాఫీస్ పేరు నమోదు చేయండి':'Enter post office name');$('hint').textContent=t('hint');$('footer').textContent=t('footer');$('langBtn').textContent=telugu?'English':'తెలుగు';
}
$('langBtn').onclick=()=>{telugu=!telugu;renderLang()};
function setMode(m){mode=m;$('pinTab').classList.toggle('active',m==='pin');$('officeTab').classList.toggle('active',m==='office');$('query').value='';renderLang();$('results').innerHTML='';$('status').textContent=''}
$('pinTab').onclick=()=>setMode('pin');$('officeTab').onclick=()=>setMode('office');
function esc(s){return String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(label,value){return `<div>${label}<b>${esc(value)}</b></div>`}
function show(items){
if(!Array.isArray(items)||!items.length){$('status').textContent=t('none');return}
$('status').textContent='';
const first=items[0],pin=first.Pincode||'';
$('results').innerHTML=`<div class="summary"><div class="pin">${esc(pin)}</div><strong>${items.length} ${t('count')}</strong><div>${esc(first.District)}, ${esc(first.State)}</div></div><div class="cards">${items.map(p=>`<article class="card"><h3>${esc(p.Name||p.BranchType||'Post Office')}</h3><div class="meta">${field(t('district'),p.District)}${field(t('state'),p.State)}${field(t('type'),p.BranchType)}${field(t('delivery'),p.DeliveryStatus)}${field(t('division'),p.Division)}${field(t('region'),p.Region)}${field(t('circle'),p.Circle)}</div></article>`).join('')}</div>`;
}
$('searchForm').addEventListener('submit',async e=>{
e.preventDefault();const q=$('query').value.trim();$('results').innerHTML='';
if(!q){$('status').textContent=t('empty');return}
if(mode==='pin'&&!/^\d{6}$/.test(q)){$('status').textContent=t('bad');return}
$('status').textContent=t('loading');
try{
const endpoint=mode==='pin'?`https://api.postalpincode.in/pincode/${encodeURIComponent(q)}`:`https://api.postalpincode.in/postoffice/${encodeURIComponent(q)}`;
const res=await fetch(endpoint);if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();
if(!Array.isArray(data)||!data[0]||data[0].Status!=='Success'){$('status').textContent=t('none');return}
show(data[0].PostOffice||[]);
}catch(err){$('status').textContent=t('error')}
});
renderLang();
</script>
</body></html>
